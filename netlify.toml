[build]
  command = "npm install --force && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Content comes from the Sanity project migrated to in Aug 2026. Pinned here
  # rather than in the Netlify UI so the deploy is reproducible from the repo —
  # the UI may still hold the previous project id.
  NEXT_PUBLIC_SANITY_PROJECT_ID = "3mm963le"
  NEXT_PUBLIC_SANITY_DATASET = "production"

[[plugins]]
  package = "@netlify/plugin-nextjs"
